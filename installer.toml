# Forge installer configuration. Schema: Locke-Werks/Forge docs/config-schema.md
#
# Paths use literal strings so a backslash stays a backslash. A TOML basic string
# would read "\b" in "{InstallDir}\bin" as a backspace.

[product]
name         = "ProjectMan"
version      = "1.1.0"
publisher    = "Locke Werks"
description  = "A control surface over your projects tree"
copyright    = "Copyright (C) 2026 Locke Werks"
url          = "https://github.com/Locke-Werks/ProjectMan"
icon         = "assets/projectman.ico"
# Stable across versions. Keys the upgrade path, so it must never change.
upgrade_code = "6f3c9a24-1e57-4b8d-a0f2-7d51c8e93b46"
aumid        = "LockeWerks.ProjectMan"

[install]
scope     = "machine"
dir       = '{ProgramFiles}\Locke Werks\ProjectMan'
elevation = "required"

[ui]
license_text = """
ProjectMan
Copyright (C) 2026 Locke Werks

This program is free software: you can redistribute it and/or modify it under the
terms of the GNU General Public License as published by the Free Software
Foundation, either version 3 of the License, or (at your option) any later
version.

This program is distributed in the hope that it will be useful, but WITHOUT ANY
WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A
PARTICULAR PURPOSE. See the GNU General Public License for more details.

You should have received a copy of the GNU General Public License along with this
program. If not, see <https://www.gnu.org/licenses/>.

Chakra Petch and Outfit are bundled under the SIL Open Font License 1.1.

The complete source is at https://github.com/Locke-Werks/ProjectMan
"""

# Windows 11 22000. The launcher targets Windows Terminal, an inbox component
# from 11 onward, and the console front end assumes a VT-capable conhost.
[[preflight]]
type = "os_build"
min  = 22000
fail = "ProjectMan needs Windows 11 or newer."

# Neither binary can be overwritten while it is running.
[[preflight]]
type            = "process_not_running"
name            = "ProjectMan.exe"
restart_manager = true
fail            = "ProjectMan is running. Close it and try again."

[[preflight]]
type            = "process_not_running"
name            = "pm.exe"
restart_manager = true
fail            = "pm is running in a terminal somewhere. Quit it with Ctrl+Q and try again."

# 120 MB. The payload is two of our own binaries plus the Qt runtime, which is
# the bulk of it, and this also covers the installer's own extraction.
[[preflight]]
type  = "free_disk_space"
bytes = 125829120
fail  = "ProjectMan needs about 120 MB free on the install volume."

[[options]]
id      = "start_menu"
label   = "Add a Start Menu shortcut"
detail  = "Puts ProjectMan in the Start Menu for everyone on this machine."
default = true

[[options]]
id      = "add_to_path"
label   = "Put pm on PATH"
detail  = "Adds the install directory to the system PATH so `pm` works from any terminal. This is the whole point of the console front end."
default = true

[[options]]
id      = "claude_hooks"
label   = "Register the Claude Code hooks"
detail  = "Writes to settings.json in your user profile, so the agent board can show what each session is doing. Runs as you, not as the administrator."
default = true

[[actions]]
type   = "shortcut"
target = '{InstallDir}\ProjectMan.exe'
name   = "ProjectMan"
when   = "start_menu"

# Native to Forge, so `pm` resolves without shipping a shim into a directory
# that happens to be on PATH already.
[[actions]]
type  = "path_append"
value = '{InstallDir}'
when  = "add_to_path"

[[actions]]
type = "arp"

# Register the hooks the agent board and the node explorer read.
#
# `as = "user"` is not optional here and is the whole reason this is a hook
# rather than an action. The file it writes is %USERPROFILE%\.claude\settings.json
# and this installer elevates, so without it the registration lands in the
# administrator's profile under over-the-shoulder UAC, and even when the same
# person elevated, the file comes out owned by BUILTIN\Administrators and Claude
# Code cannot rewrite it afterwards. Both failures are silent.
#
# `pm hook install` is idempotent and repairs an existing registration in place
# rather than duplicating it, which is what makes it safe on every upgrade. It
# registers whatever path it is running from, so running it as a payload member
# is what points the hooks at {InstallDir}\pm.exe and not at wherever the last
# build happened to be.
#
# post_install, not post_extract: nothing here needs the registry or the
# shortcuts, but there is also no reason to write into somebody's profile before
# the install itself is known to have worked.
#
# Not vital. A hook registration that failed costs the board its detail, and the
# registry still carries every session, so the product works without it. Failing
# the whole install over it would be the wrong trade.
[[hooks.post_install]]
id     = "claude_hooks"
run    = "payload:pm.exe"
args   = ["hook", "install"]
as     = "user"
when   = "claude_hooks"
sha256 = "auto"

# And take them out again, before the binary they point at is deleted. A stale
# entry in settings.json is not harmless: Claude Code runs it on every tool call
# in every session, and one naming a path that no longer exists pays a failed
# process launch each time.
#
# Same option gate as the install, evaluated against what was actually chosen,
# so an install that never registered them does not try to unregister them.
[[hooks.pre_uninstall]]
id     = "claude_hooks"
run    = "payload:pm.exe"
args   = ["hook", "uninstall"]
as     = "user"
when   = "claude_hooks"
sha256 = "auto"
